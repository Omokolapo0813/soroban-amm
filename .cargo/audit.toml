[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    # crypto-bigint 0.5.5 timing leaks in constant-time ops. Reached only through
    # soroban-sdk -> soroban-env-host -> k256 -> elliptic-curve, i.e. the SDK's
    # host/testutils side, never the contract WASM. The fix is 0.7.6, which the
    # pinned elliptic-curve 0.13 cannot take, so it needs a soroban-sdk upgrade.
    # Remove this entry when soroban-sdk is bumped.
    "RUSTSEC-2026-0387",
]
